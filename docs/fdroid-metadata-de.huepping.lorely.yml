# Entwurf des fdroiddata-Rezepts (metadata/de.huepping.lorely.yml).
# Summary/Description kommen aus fastlane/ im App-Repo.
# F-Droid baut reproduzierbar nach und liefert unser eigenes signiertes APK aus (Binaries + AllowedAPKSigningKeys).
# Vor dem Merge Request: `commit` auf den vollen Git-Hash des Tags setzen (Tag v0.1 und GitHub-Release mit APK müssen existieren).
# Node: offizielle Datei, Version und Prüfsumme wie in docs/build.md (nicht die Debian-Version, sonst kein Byte-gleiches APK).
# Alles Bauen steht in `build:` (prebuild darf nichts bauen); node_modules/ entsteht erst nach dem Quellcode-Scan.

Categories:
  - Action Game
License: MIT
AuthorName: Björn Hüpping
SourceCode: https://github.com/bhuepping/lorely
IssueTracker: https://github.com/bhuepping/lorely/issues

AutoName: LoReLy

RepoType: git
Repo: https://github.com/bhuepping/lorely.git

Binaries: https://github.com/bhuepping/lorely/releases/download/v%v/LoReLy-%v.apk
AllowedAPKSigningKeys: f72dd4cc0dcd77bb91f5e18cd940a0332dd8ccfb933546334c74b8db07eda46f

Builds:
  - versionName: '0.1'
    versionCode: 1
    commit: v0.1
    subdir: android/app
    sudo:
      - curl -fsSLo /tmp/node.tar.gz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz
      - echo "9d942932535988091034dc94cc5f42b6dc8784d6366df3a36c4c9ccb3996f0c2  /tmp/node.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1 --exclude='*.md' --exclude=LICENSE
      - node --version
    build:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '0.1'
CurrentVersionCode: 1
